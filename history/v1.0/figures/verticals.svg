<rect width="1000" height="1142" fill="var(--surface)"/>
<text x="24.0" y="30.0" class="h1" text-anchor="start">Quick LoRA (&lt; $2, &lt; 2 GPU-h per task) on Wald-4B beats Jev on 9 of 12 tasks</text>
<text x="24.0" y="50.0" class="xs t2" text-anchor="start">Same fixed test items and byte-identical requests for every system. Ours = one LoRA on the task&#x27;s labels, $0.12–$1.81 of GPU time each; the others are zero-shot. Jev cannot be fine-tuned.</text>
